name: Atualizar contagem mensal de matriculas

on:
  schedule:
    # Dia 1 de cada mes, 09:00 UTC (06:00 Brasilia)
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      ate:
        description: "Ultimo ano-mes a processar (YYYY-MM). Vazio = mes anterior ao atual."
        required: false
        default: ""
      test_email:
        description: "Email de teste (override do MAIL_TO). Se preenchido, forca envio para este email apenas."
        required: false
        default: ""
      forcar_envio:
        description: "Forcar envio de e-mail mesmo sem mudancas (true/false)."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: atualizar-historico
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Atualizar historico
        run: |
          ARGS=""
          if [ -n "${{ inputs.ate }}" ]; then
            ARGS="--ate ${{ inputs.ate }}"
          fi
          python scripts/atualizar_historico.py $ARGS

      - name: Commit & push se houver mudancas
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Sem mudancas para commitar."
          else
            git commit -m "chore(historico): atualizacao automatica $(date -u +%Y-%m-%d)"
            git push
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcular metricas para e-mail
        id: metricas
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          df = pd.read_csv("docs/contagem_mensal.csv")
          ultimo = df["ano_mes"].max()
          primeiro = df["ano_mes"].min()
          total_mes = int(df[df["ano_mes"] == ultimo]["count"].sum())
          total_acum = int(df["count"].sum())
          n_meses = df["ano_mes"].nunique()
          # Top 5 cursos
          top = (
              df.groupby("tx_nome_curso")["count"].sum()
                .sort_values(ascending=False)
                .head(5)
          )
          top_str = "\n".join(f"  - {n} ({v:,})" for n, v in top.items())
          print(f"ultimo_mes={ultimo}")
          print(f"primeiro_mes={primeiro}")
          print(f"total_mes={total_mes:,}")
          print(f"total_acum={total_acum:,}")
          print(f"n_meses={n_meses}")
          print("top5<<EOF")
          print(top_str)
          print("EOF")
          PY

      - name: Definir destinatarios
        id: destino
        run: |
          if [ -n "${{ inputs.test_email }}" ]; then
            echo "to=${{ inputs.test_email }}" >> "$GITHUB_OUTPUT"
            echo "modo=TESTE" >> "$GITHUB_OUTPUT"
          else
            echo "to=${{ secrets.MAIL_TO }}" >> "$GITHUB_OUTPUT"
            echo "modo=PRODUCAO" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar e-mail
        if: steps.commit.outputs.mudou == 'true' || inputs.forcar_envio == 'true' || inputs.test_email != ''
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: "ENAP Matriculas (GitHub Actions) <${{ secrets.MAIL_USERNAME }}>"
          to: ${{ steps.destino.outputs.to }}
          subject: "[ENAP][${{ steps.destino.outputs.modo }}] Matriculas concluidas — ${{ steps.metricas.outputs.primeiro_mes }} a ${{ steps.metricas.outputs.ultimo_mes }}"
          body: |
            Olá,

            Relatório mensal de matrículas concluídas (35 cursos da meta) na Escola Virtual da ENAP.

            Janela coberta: ${{ steps.metricas.outputs.primeiro_mes }} a ${{ steps.metricas.outputs.ultimo_mes }} (${{ steps.metricas.outputs.n_meses }} meses)

            ► Total acumulado da meta: ${{ steps.metricas.outputs.total_acum }} matrículas concluídas
            ► Total no mês mais recente (${{ steps.metricas.outputs.ultimo_mes }}): ${{ steps.metricas.outputs.total_mes }}

            Top 5 cursos no acumulado:
            ${{ steps.metricas.outputs.top5 }}

            Página pública: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            CSV completo: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/contagem_mensal.csv

            Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            Modo desta execução: ${{ steps.destino.outputs.modo }}
            (Mensagem automática enviada apenas quando há mês novo, ou em testes manuais.)
