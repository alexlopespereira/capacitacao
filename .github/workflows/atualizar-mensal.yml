name: Atualizar contagem mensal de matriculas

# Este workflow ja teve um step de envio mensal por e-mail. Ele nunca disparou
# pelo cron (a condicao exigia workflow_dispatch — issue #1) e em 2026-08-13
# foi DESATIVADO em definitivo, por decisao de produto: o canal de aviso e a
# pagina publica, nao e-mail. Nao reintroduzir sem decisao explicita; os
# secrets MAIL_USERNAME/MAIL_PASSWORD/MAIL_TO deixaram de ser usados.

on:
  schedule:
    # Dia 1 de cada mes, 09:00 UTC (06:00 Brasilia)
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      ate:
        description: "Ultimo ano-mes a processar (YYYY-MM). Vazio = mes anterior ao atual."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-historico
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Baixar dump ENAP (uma vez)
        run: |
          DUMP="${RUNNER_TEMP}/enap_ultimos12.tar.gz"
          python - "$DUMP" <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from atualizar_historico import URL_DEFAULT
          from urllib.request import urlopen
          destino = sys.argv[1]
          print(f"Baixando {URL_DEFAULT}...", flush=True)
          data = urlopen(URL_DEFAULT, timeout=600).read()
          with open(destino, "wb") as f:
              f.write(data)
          print(f"Download: {len(data) / 1024 / 1024:.1f} MB -> {destino}")
          PY
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"

      - name: Atualizar historico e gerar dashboard
        run: |
          ARGS=""
          if [ -n "${{ inputs.ate }}" ]; then
            ARGS="--ate ${{ inputs.ate }}"
          fi
          # Historico (tabela pivot + pessoas + index.html)
          python scripts/atualizar_historico.py --source "$DUMP" $ARGS
          # Base fato do dashboard (mesma janela; merge idempotente preserva
          # meses fora do dump). Os 3 geradores seguintes leem docs/dashboard_base.csv.
          python scripts/gerar_base_dashboard.py --source "$DUMP" $ARGS
          python scripts/gerar_publico_alvo.py
          python scripts/gerar_distribuicao_publico.py
          python scripts/gerar_programa.py

      - name: Commit & push se houver mudancas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "Sem mudancas para commitar."
          else
            git commit -m "chore(historico): atualizacao automatica $(date -u +%Y-%m-%d)"
            git push
          fi
